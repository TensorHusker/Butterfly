[package]
name = "butterfly-comm"
version = "0.1.0"
edition = "2021"

[dependencies]
butterfly-core = { path = "../butterfly-core" }
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
async-trait = "0.1"
thiserror = "1.0"
bytes = "1.5"
futures = "0.3"
tracing = "0.1"
dashmap = "5.5"
lz4 = "1.24"
